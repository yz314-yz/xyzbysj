name: qwen25-vl

services:
  qwen25-vl:
    image: vllm/vllm-openai:latest
    container_name: qwen25-vl-openai
    restart: unless-stopped
    ipc: host
    ports:
      - "${QWEN_PORT:-8000}:8000"
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_ENDPOINT: ${HF_ENDPOINT:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - qwen25_vl_hf_cache:/root/.cache/huggingface
    command:
      - --model
      - ${OPEN_MODEL_PATH:-Qwen/Qwen2.5-VL-3B-Instruct}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --served-model-name
      - ${OPEN_MODEL_NAME:-Qwen/Qwen2.5-VL-3B-Instruct}
      - --trust-remote-code
      - --quantization
      - bitsandbytes
      - --gpu-memory-utilization
      - "0.70"
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "1"
      - --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  qwen25_vl_hf_cache:

