# Reference template: ghcr-docker-build.yml (v0.3)
# Adapted for jetlag-backend
# Monorepo structure: Dockerfile is in jetlag-backend/
# Build context: jetlag-backend/

name: Build and Push Backend Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'jetlag-backend/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/jetlag-sync-backend:latest

jobs:
  docker:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: jetlag-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract DEEPSEEK_API_KEY from .env
        run: |
          if [ -f .env ]; then
            grep "^DEEPSEEK_API_KEY=" .env | sed 's/DEEPSEEK_API_KEY=/::set-output name=api_key::/' || true
          fi
        id: extract_env

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: jetlag-backend
          file: jetlag-backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}
          build-args: |
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
